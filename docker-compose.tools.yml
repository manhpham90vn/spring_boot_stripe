name: ticketing-tools

# ---------------------------------------------------------------------------
# Tools quản lý hạ tầng — tách riêng cho gọn, KHÔNG bật cùng stack chính.
# Join vào network ngoài "ticketing-net" (do docker-compose.yml tạo) để gọi
# postgres/redis/kafka/service qua DNS nội bộ.
#
#   # bật stack chính trước (tạo network ticketing-net):
#   docker compose --profile db --profile services up -d
#   # rồi bật tools:
#   docker compose -f docker-compose.tools.yml --profile tools up -d
#
#   pgweb        -> http://localhost:8091   (Postgres, chế độ sessions: tự nhập DB)
#   redisinsight -> http://localhost:5540   (Redis; add host redis:6379)
#   kafka-ui     -> http://localhost:8090   (Kafka topic + Debezium connect)
#   swagger-ui   -> http://localhost:8092/swagger  (cũng vào được qua nginx /swagger/)
# ---------------------------------------------------------------------------

services:
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: ticketing-pgweb
    profiles: ["tools"]
    restart: unless-stopped
    # Chế độ sessions: form đăng nhập tự chọn DB (auth/catalog/order/...) vì mỗi
    # service một database. Host: postgres  Port: 5432  User/Pass: app/app (mặc định).
    command: ["pgweb", "--bind", "0.0.0.0", "--listen", "8081", "--sessions"]
    ports:
      - "8091:8081"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ticketing-redisinsight
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: ticketing-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ticketing
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: ticketing-swagger-ui
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8092:8080"
    environment:
      BASE_URL: /swagger
      URLS_PRIMARY_NAME: catalog
      URLS: >-
        [
          {"name": "auth", "url": "/api-docs/auth"},
          {"name": "catalog", "url": "/api-docs/catalog"},
          {"name": "inventory", "url": "/api-docs/inventory"},
          {"name": "order", "url": "/api-docs/order"},
          {"name": "payment", "url": "/api-docs/payment"},
          {"name": "ticket", "url": "/api-docs/ticket"},
          {"name": "notification", "url": "/api-docs/notification"},
          {"name": "waitingroom", "url": "/api-docs/waitingroom"}
        ]

# Network ngoài do stack chính (docker-compose.yml) tạo.
networks:
  default:
    name: ticketing-net
    external: true

volumes:
  redisinsight-data:
