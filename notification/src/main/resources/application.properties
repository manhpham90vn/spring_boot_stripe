spring.application.name=notification
server.port=8088

spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.stream.default.group=notification
spring.cloud.stream.default.consumer.auto-offset-reset=earliest

# Consume the user.* event stream (produced by auth's outbox via Debezium, topic
# = <aggregate_type>.events) and send the welcome email. Filter by the eventType
# header if more user events are added later.
spring.cloud.function.definition=userRegisteredSink
spring.cloud.stream.bindings.userRegisteredSink-in-0.destination=user.events

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
