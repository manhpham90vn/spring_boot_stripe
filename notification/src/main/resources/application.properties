spring.application.name=notification
server.port=8088

# --- Kafka qua Spring Cloud Stream ------------------------------------------
# Địa chỉ broker Kafka (self-hosted). Lấy từ biến môi trường, mặc định localhost cho dev.
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
# Consumer group mặc định: Kafka chia message trong group cho các instance → scale ngang
# mà không xử lý trùng. Mọi replica của notification dùng chung group "notification".
spring.cloud.stream.default.group=notification
# Lần đầu (chưa có offset đã lưu) thì đọc từ ĐẦU topic (earliest) để không bỏ sót event cũ.
spring.cloud.stream.default.consumer.auto-offset-reset=earliest

# Tiêu thụ luồng event user.* (do outbox của Auth phát qua Debezium; topic = <aggregate_type>.events)
# và gửi email chào mừng. Nếu sau này thêm nhiều loại event user thì lọc theo header eventType.
# function.definition: HAI consumer nối bằng dấu ; — chào mừng + xác nhận đơn.
spring.cloud.function.definition=userRegisteredSink;orderCompletedSink
# Binding "<tên hàm>-in-0" = cổng vào của consumer; trỏ tới topic tương ứng.
spring.cloud.stream.bindings.userRegisteredSink-in-0.destination=user.events
spring.cloud.stream.bindings.orderCompletedSink-in-0.destination=order.events

# --- Mail (SMTP) ------------------------------------------------------------
# Dev trỏ tới SMTP cục bộ (vd MailHog cổng 1025) — bắt mail để xem, không gửi thật.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
