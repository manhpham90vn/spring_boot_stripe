spring.application.name=payment
server.port=8086

# === PostgreSQL riêng của Payment (bản ghi thanh toán, idempotency key, ref Stripe) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# === Spring Cloud Stream (Kafka binder) ===
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=payment
spring.cloud.stream.default.consumer.auto-offset-reset=earliest
# Khai báo hàm xử lý + binding khi viết code, ví dụ:
# spring.cloud.function.definition=onPaymentRequested
# spring.cloud.stream.bindings.onPaymentRequested-in-0.destination=payment.requested
# spring.cloud.stream.bindings.paymentCompleted-out-0.destination=payment.completed

# === Stripe (một tài khoản). Đặt qua biến môi trường, KHÔNG commit secret thật. ===
stripe.api-key=${STRIPE_API_KEY:sk_test_dummy}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}

# === Actuator / metrics ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
