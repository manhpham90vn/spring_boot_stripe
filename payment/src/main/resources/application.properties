# Payment — cổng DUY NHẤT gọi ra Stripe (một tài khoản). (Code chưa viết, đây là config khung.)
spring.application.name=payment
server.port=8086

# --- DB riêng: bản ghi thanh toán, idempotency key, tham chiếu Stripe -------
spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka: webhook Stripe sau khi verify được đẩy vào Kafka rồi mới xử lý ---
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=payment
spring.cloud.stream.default.consumer.auto-offset-reset=earliest

# --- Stripe -----------------------------------------------------------------
# api-key: khoá BÍ MẬT gọi API Stripe (sk_...). KHÔNG commit khoá thật — nạp từ K8s Secret;
# mặc định ở đây là khoá test giả để chạy local.
stripe.api-key=${STRIPE_API_KEY:sk_test_dummy}
# webhook-secret (whsec_...): để VERIFY chữ ký webhook Stripe gửi tới, chống giả mạo. Webhook
# vào thẳng service này qua Ingress riêng (reverse proxy DMZ), bỏ qua apigateway.
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
# Lưu ý (chưa cấu hình ở đây nhưng cần khi code): Payment phải có rate limiter + retry
# exponential backoff (Resilience4j) để không vượt ~100-200 req/s của Stripe và xử lý 429 sạch.

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
