# Payment — cổng DUY NHẤT gọi ra Stripe (một tài khoản, Payment Intents, chốt qua webhook).
spring.application.name=payment
server.port=8086

# --- DB riêng: bản ghi thanh toán, idempotency key, tham chiếu Stripe -------
spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka: webhook Stripe sau khi verify được đẩy vào Kafka rồi mới xử lý ---
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=payment
spring.cloud.stream.default.consumer.auto-offset-reset=earliest

# --- Stripe (cổng THẬT, không mock) -----------------------------------------
# api-key: khoá BÍ MẬT gọi API Stripe (sk_...). KHÔNG commit khoá thật — nạp từ K8s Secret/env.
# Mặc định khoá test giả: build/khởi động được, nhưng tạo intent sẽ lỗi tới khi đặt STRIPE_API_KEY thật.
stripe.api-key=${STRIPE_API_KEY:sk_test_dummy}
# webhook-secret (whsec_...): để VERIFY chữ ký webhook Stripe gửi tới, chống giả mạo. Webhook
# vào thẳng service này qua Ingress riêng (reverse proxy DMZ), bỏ qua apigateway.
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
# --- Resilience4j cho lời gọi ra Stripe (xem StripePaymentGateway) ----------
# Rate limiter: giữ DƯỚI ~100-200 req/s của Stripe (vượt = 429). Ở đây 100 req/giây,
# chờ tối đa 2s để có "vé" trước khi từ chối.
resilience4j.ratelimiter.instances.stripe.limit-for-period=100
resilience4j.ratelimiter.instances.stripe.limit-refresh-period=1s
resilience4j.ratelimiter.instances.stripe.timeout-duration=2s
# Retry: chỉ thử lại lỗi tạm thời (bọc StripeTransientException), backoff lũy thừa + có trần.
resilience4j.retry.instances.stripe.max-attempts=4
resilience4j.retry.instances.stripe.wait-duration=200ms
resilience4j.retry.instances.stripe.enable-exponential-backoff=true
resilience4j.retry.instances.stripe.exponential-backoff-multiplier=2
resilience4j.retry.instances.stripe.retry-exceptions=com.manhpham.payment.gateway.StripeTransientException

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
