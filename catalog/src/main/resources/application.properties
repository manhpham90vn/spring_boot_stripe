spring.application.name=catalog
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/catalog
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# --- Resource server (common-security) --------------------------------------
# Verify Bearer JWT cục bộ bằng public key lấy từ JWKS của Auth (cache, không gọi
# Auth mỗi request). issuer phải khớp auth.jwt.issuer.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/oauth2/jwks}
app.security.issuer=${JWT_ISSUER:auth}

# Luật phân quyền của Catalog — TOÀN BỘ khai báo ở ĐÂY (common-security đọc & dựng filter,
# không cần SecurityConfig viết tay). Xét theo thứ tự; khớp trước thắng.
#   [0] Ghi/đọc khu admin: cần role ADMIN (mọi method, kể cả GET danh sách admin).
app.security.rules[0].pattern=/api/catalog/admin/**
app.security.rules[0].role=ADMIN
#   [1] Duyệt danh mục: chỉ GET, công khai (không cần token).
app.security.rules[1].method=GET
app.security.rules[1].pattern=/api/catalog/**
app.security.rules[1].access=PERMIT_ALL
# Còn lại (vd POST thẳng /api/catalog/**) → mặc định authenticated.

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
