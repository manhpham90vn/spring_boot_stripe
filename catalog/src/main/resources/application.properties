spring.application.name=catalog
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/catalog
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# --- Resource server (common-security) --------------------------------------
# Verify Bearer JWT cục bộ bằng public key lấy từ JWKS của Auth (cache, không gọi
# Auth mỗi request). issuer phải khớp auth.jwt.issuer.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/oauth2/jwks}
app.security.issuer=${JWT_ISSUER:auth}
# Mặc định: mọi endpoint nghiệp vụ cần JWT hợp lệ (chỉ actuator/swagger mở sẵn).
# Khi có controller duyệt danh mục công khai thì liệt kê path vào đây, vd:
#   app.security.public-paths=/api/catalog/events/**,/api/catalog/events
# LƯU Ý: match theo PATH (mọi HTTP method). Muốn "GET công khai, ghi cần auth"
# thì đặt endpoint đọc dưới prefix riêng (vd /api/catalog/public/**).

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
