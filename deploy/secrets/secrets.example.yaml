# MẪU — KHÔNG commit secret thật. Tạo tay 1 lần trong namespace ticketing,
# hoặc tốt hơn dùng Sealed Secrets / External Secrets để theo GitOps an toàn.
#
# LƯU Ý: credential DB KHÔNG cần tạo tay — CloudNativePG tự sinh secret
# "<svc>-db-app" (keys username/password) cho mỗi cluster trong deploy/infra/postgres.
# App đọc thẳng qua valueFrom (xem deploy/apps/*.values.yaml).
#
# Chỉ cần tạo tay 2 secret sau:
#
#   # Stripe (chỉ payment dùng)
#   kubectl -n ticketing create secret generic payment-stripe \
#     --from-literal=STRIPE_API_KEY='sk_live_xxx' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='whsec_xxx'
#
#   # JWT keypair cho auth (mount thành file ở /keys)
#   kubectl -n ticketing create secret generic auth-jwt \
#     --from-file=jwt-private.pem=infra/keys/jwt-private.pem \
#     --from-file=jwt-public.pem=infra/keys/jwt-public.pem
#
#   # MinIO root credential (object storage — deploy/infra/minio)
#   kubectl -n ticketing create secret generic minio-creds \
#     --from-literal=root-user='minioadmin' \
#     --from-literal=root-password='<đặt-mật-khẩu-mạnh>'
#
#   # Cùng credential MinIO nhưng cho Loki (namespace monitoring) — Loki dùng MinIO làm object store.
#   # Keys phải tên MINIO_USER/MINIO_PASSWORD (khớp expand-env trong loki values).
#   kubectl create namespace monitoring 2>/dev/null; \
#   kubectl -n monitoring create secret generic loki-minio \
#     --from-literal=MINIO_USER='minioadmin' \
#     --from-literal=MINIO_PASSWORD='<đặt-mật-khẩu-mạnh>'   # = root-password ở trên
#
#   # Docker Hub: BẮT BUỘC cho Kafka Connect build (push image plugin Debezium) + pull image
#   # đã build + (tuỳ chọn) repo private service. Strimzi dùng làm pushSecret trong connect.yaml.
#   kubectl -n ticketing create secret docker-registry dockerhub \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username='<user>' --docker-password='<token>'
apiVersion: v1
kind: Secret
metadata:
  name: payment-stripe
  namespace: ticketing
type: Opaque
stringData:
  STRIPE_API_KEY: sk_test_CHANGE_ME
  STRIPE_WEBHOOK_SECRET: whsec_CHANGE_ME
