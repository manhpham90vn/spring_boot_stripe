# Kafka Connect cluster (Strimzi) chạy các Debezium outbox connector — tương đương service
# "connect" + "connect-init" ở docker-compose, nhưng KHAI BÁO (GitOps) thay vì POST REST tay.
# - use-connector-resources=true → connector quản bằng KafkaConnector CRD (deploy/infra/kafka/connectors/).
# - spec.build: Strimzi tự build image base-Strimzi + plugin Debezium Postgres rồi push lên registry.
#   (image quay.io/debezium/connect KHÔNG dùng được với Strimzi — khác entrypoint/cấu trúc.)
# - DB credential đọc từ secret CNPG "ticketing-db-app" qua DirectoryConfigProvider (không hardcode).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: ticketing-connect
  namespace: ticketing
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 3.8.0
  replicas: 2                       # khớp "debezium-connect×2" (cluster-topology.md §3.1)
  bootstrapServers: ticketing-kafka-bootstrap:9092
  template:
    pod:
      nodeSelector:
        workload: app               # Connect chạy trên pool app (không phải data)
      imagePullSecrets:
        - name: dockerhub           # kéo image đã build (bỏ nếu repo public)
  build:
    output:
      type: docker
      image: docker.io/REPLACE_ME/ticketing-connect:latest   # nơi Strimzi push image đã build
      pushSecret: dockerhub                                   # secret docker-registry để push
    plugins:
      - name: debezium-postgres-connector
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/2.7.4.Final/debezium-connector-postgres-2.7.4.Final-plugin.tar.gz
  config:
    group.id: ticketing-connect
    offset.storage.topic: connect-cluster-offsets
    config.storage.topic: connect-cluster-configs
    status.storage.topic: connect-cluster-status
    # 3 broker → RF 3 cho topic nội bộ của Connect (bền như luồng tiền/vé).
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    # Provider để connector đọc user/password DB từ file secret đã mount (KHÔNG hardcode).
    config.providers: secrets
    config.providers.secrets.class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
  externalConfiguration:
    volumes:
      - name: db-creds
        secret:
          secretName: ticketing-db-app    # CNPG tự sinh (keys: username/password)
