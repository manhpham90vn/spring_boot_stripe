# Kafka self-hosted bằng Strimzi (KRaft mode, không ZooKeeper).
# Tên cluster "ticketing" → bootstrap service "ticketing-kafka-bootstrap:9092".
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: ticketing
  labels:
    strimzi.io/cluster: ticketing
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
  template:
    pod:
      tolerations:
        - key: dedicated
          operator: Equal
          value: data
          effect: NoSchedule
      affinity:
        nodeAffinity:                # ghim broker lên node pool data
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: [data]
        podAntiAffinity:             # mỗi node data tối đa 1 broker
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: ticketing
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ticketing
  namespace: ticketing
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Bền vững cho luồng tiền/vé: replication 3, min ISR 2.
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
