name: notification
port: 8088
replicas: 2
image:
  repo: docker.io/REPLACE_ME/notification
  tag: latest
config:
  SPRING_DATASOURCE_URL: jdbc:postgresql://ticketing-db-rw:5432/notification
  # Consumer async (đồng thời thấp). Pool nhỏ (xem cluster-topology.md §5.5). 2 replica × 5 = 10.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  # Prod: trỏ SMTP thật. Dev/compose dùng mailpit:1025.
  SPRING_MAIL_HOST: mailpit
  SPRING_MAIL_PORT: "1025"
env:
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom: { secretKeyRef: { name: ticketing-db-app, key: username } }
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom: { secretKeyRef: { name: ticketing-db-app, key: password } }
