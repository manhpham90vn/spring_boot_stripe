name: inventory
port: 8083
# Service tranh chấp cao nhất khi flash sale → cấp nhiều replica hơn.
replicas: 3
image:
  repo: docker.io/REPLACE_ME/inventory
  tag: latest
config:
  SPRING_DATASOURCE_URL: jdbc:postgresql://ticketing-db-rw:5432/inventory
  # Hot path (ghi SOLD bền). Pool chốt cứng (xem cluster-topology.md §5.5). 3 replica × 10 = 30.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "10"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
env:
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom: { secretKeyRef: { name: ticketing-db-app, key: username } }
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom: { secretKeyRef: { name: ticketing-db-app, key: password } }
