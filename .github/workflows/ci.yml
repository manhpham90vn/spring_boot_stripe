name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'        # bump tag ở deploy/ KHÔNG được kích lại CI (chống loop)
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}   # Settings > Variables (không bí mật)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + test toàn reactor (libs trước, rồi 9 service)
        run: ./mvnw -B -ntp verify

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        svc: [apigateway, auth, catalog, inventory, order, payment, ticket, notification, waitingroom]
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=git-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # Docker Hub Access Token
      - uses: docker/build-push-action@v6
        with:
          context: .                                  # ROOT repo (cần root pom + libs/)
          file: ${{ matrix.svc }}/Dockerfile
          build-args: SERVICE=${{ matrix.svc }}
          push: true
          tags: docker.io/${{ env.DOCKERHUB_USER }}/${{ matrix.svc }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-tags:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write        # để commit ngược bump tag
    steps:
      - uses: actions/checkout@v4
      - name: Bump image.tag trong deploy/apps/*.values.yaml
        run: |
          TAG="git-${GITHUB_SHA::7}"
          for svc in apigateway auth catalog inventory order payment ticket notification waitingroom; do
            yq -i ".image.tag = \"$TAG\"" "deploy/apps/$svc.values.yaml"
          done
      - name: Commit & push
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Không có thay đổi tag."
          else
            git commit -am "ci: bump images to git-${GITHUB_SHA::7} [skip ci]"
            git push
          fi
