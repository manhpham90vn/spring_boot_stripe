# Tên service (hiện trong log/trace/metrics) và cổng HTTP. Mỗi service một cổng riêng khi chạy local.
spring.application.name=auth
server.port=8081

# --- Database riêng của Auth (database-per-service) -------------------------
# Mỗi service sở hữu DB PostgreSQL RIÊNG, không dùng chung — đây là ràng buộc kiến trúc.
spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=app
spring.datasource.password=app
# validate: Hibernate chỉ KIỂM TRA schema khớp entity, KHÔNG tự tạo/sửa bảng. Schema do
# migration (Flyway/Liquibase) hoặc DBA quản lý → tránh app vô tình đổi cấu trúc DB ở prod.
spring.jpa.hibernate.ddl-auto=validate
# Tắt Open-Session-In-View: không giữ session JPA mở suốt vòng đời request. Buộc nạp dữ
# liệu xong trong tầng service (trong transaction), tránh lazy-loading lén ở tầng view và
# giữ kết nối DB lâu — quan trọng khi tải cao.
spring.jpa.open-in-view=false

# --- JWT (xem JwtProperties / JwtKeys) --------------------------------------
# issuer: giá trị claim "iss" gắn vào token; mọi resource-server kiểm khớp đúng chuỗi này.
auth.jwt.issuer=auth
# Thời hạn access token. Ngắn để giảm rủi ro nếu lộ; đủ dài để đỡ phải đăng nhập lại liên tục.
auth.jwt.access-token-ttl=1h
# Cặp khoá ký RS256, nạp từ biến môi trường (thường là K8s Secret). Để TRỐNG ở local thì
# JwtKeys tự sinh khoá tạm (chỉ hợp dev 1 replica; token reset mỗi lần restart).
auth.jwt.private-key=${AUTH_JWT_PRIVATE_KEY:}
auth.jwt.public-key=${AUTH_JWT_PUBLIC_KEY:}

# --- Outbox housekeeping (xem OutboxPurgeJob) -------------------------------
# Giữ row outbox tối đa 3 ngày (P3D, định dạng ISO-8601 Duration) rồi dọn. Đây CHỈ là dọn rác,
# không phải phát event (Debezium đọc WAL mới là nơi phát).
auth.outbox.retention=P3D
# Lịch chạy job dọn: 3h sáng mỗi ngày (cron 6 trường của Spring: giây phút giờ ngày tháng thứ).
auth.outbox.purge-cron=0 0 3 * * *

# --- Observability (giống mọi service) --------------------------------------
# Mở các actuator cho hạ tầng: health (K8s probe), prometheus (scrape metrics)...
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# 0.0 = mặc định KHÔNG xuất trace (tránh quá tải lúc cao điểm); tăng lên khi cần debug.
management.tracing.sampling.probability=0.0
# Đầu thu OTLP của OpenTelemetry collector để gửi trace.
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
