spring.application.name=auth
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

auth.jwt.issuer=auth
auth.jwt.access-token-ttl=1h
auth.jwt.private-key=${AUTH_JWT_PRIVATE_KEY:}
auth.jwt.public-key=${AUTH_JWT_PUBLIC_KEY:}

auth.outbox.retention=P3D
auth.outbox.purge-cron=0 0 3 * * *

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
