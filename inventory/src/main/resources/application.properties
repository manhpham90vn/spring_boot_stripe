# Service tồn kho — nơi tranh chấp cao nhất lúc flash sale. (Code chưa viết, đây là config khung.)
spring.application.name=inventory
server.port=8083

# --- DB riêng (nguồn sự thật về tồn kho: trạng thái SOLD ghi bền xuống đây) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=app
spring.datasource.password=app
# validate: chỉ kiểm tra schema khớp entity, không tự đổi cấu trúc DB (xem giải thích ở auth).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Redis: HOT PATH của Inventory ------------------------------------------
# Đây mới là điểm cốt lõi: GA dùng counter Redis (DECRBY), ghế ngồi dùng SET NX + TTL để
# giữ chỗ. Redis chịu tải tranh chấp lớn; PostgreSQL chỉ chốt trạng thái SOLD cuối cùng.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Kafka: nhận/phát event trong saga mua vé -------------------------------
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=inventory
spring.cloud.stream.default.consumer.auto-offset-reset=earliest

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
