spring.application.name=inventory
server.port=8083

# === PostgreSQL riêng của Inventory (nguồn sự thật trạng thái SOLD) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# === Redis: counter DECRBY (GA) + seat hold SET NX/TTL ===
spring.data.redis.host=localhost
spring.data.redis.port=6379

# === Spring Cloud Stream (Kafka binder) ===
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=inventory
spring.cloud.stream.default.consumer.auto-offset-reset=earliest
# Khai báo hàm xử lý + binding khi viết code, ví dụ:
# spring.cloud.function.definition=onOrderCreated
# spring.cloud.stream.bindings.onOrderCreated-in-0.destination=order.created
# spring.cloud.stream.bindings.inventoryReserved-out-0.destination=inventory.reserved

# === Actuator / metrics ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
