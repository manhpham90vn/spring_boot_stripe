spring.application.name=order
server.port=8084

# === PostgreSQL riêng của Order (đơn hàng + trạng thái saga + outbox) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/order
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# === Spring Cloud Stream (Kafka binder) ===
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=order
spring.cloud.stream.default.consumer.auto-offset-reset=earliest
# Khai báo hàm xử lý + binding khi viết code, ví dụ:
# spring.cloud.function.definition=onPaymentCompleted
# spring.cloud.stream.bindings.onPaymentCompleted-in-0.destination=payment.completed
# spring.cloud.stream.bindings.orderCompleted-out-0.destination=order.completed

# === Địa chỉ service downstream mà Saga gọi (local; trên K8s đổi sang DNS nội bộ) ===
services.inventory.url=http://localhost:8083
services.payment.url=http://localhost:8086

# === Actuator / metrics ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
