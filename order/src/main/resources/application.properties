# Order — "trái tim điều phối", chính là Saga orchestrator của luồng mua vé.
spring.application.name=order
server.port=8084

# --- DB riêng: sở hữu đơn hàng + trạng thái saga + bảng outbox --------------
spring.datasource.url=jdbc:postgresql://localhost:5432/order
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Resource server (common-security): /api/order/** cần JWT ---------------
# Verify JWT cục bộ bằng JWKS của Auth. /internal/** + actuator được common-security mở sẵn.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/internal/jwks}
app.security.issuer=${JWT_ISSUER:auth}

# --- Kafka: phát OrderCompleted (outbox) + CONSUME payment.events để tiếp tục saga --
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.stream.default.group=order
spring.cloud.stream.default.consumer.auto-offset-reset=earliest
# Consumer: bean paymentSettledSink ← topic payment.events (kết quả thanh toán).
spring.cloud.function.definition=paymentSettledSink
spring.cloud.stream.bindings.paymentSettledSink-in-0.destination=payment.events

# --- Địa chỉ các service mà saga gọi ĐỒNG BỘ để điều phối --------------------
# Orchestrator gọi Inventory (giữ chỗ) rồi Payment (thu tiền); lỗi thì chạy bù trừ
# (compensating transaction). Local trỏ localhost; trên K8s thay bằng DNS nội bộ http://<svc>:<port>.
services.catalog.url=${SERVICES_CATALOG_URL:http://localhost:8082}
services.inventory.url=${SERVICES_INVENTORY_URL:http://localhost:8083}
services.payment.url=${SERVICES_PAYMENT_URL:http://localhost:8086}

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
