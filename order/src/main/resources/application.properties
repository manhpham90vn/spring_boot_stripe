# Order — "trái tim điều phối", chính là Saga orchestrator của luồng mua vé.
# (Code chưa viết, đây là config khung.)
spring.application.name=order
server.port=8084

# --- DB riêng: sở hữu đơn hàng + trạng thái saga + bảng outbox --------------
spring.datasource.url=jdbc:postgresql://localhost:5432/order
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka: phát event "đơn hoàn tất" cho Ticket/Notification consume -------
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=order
spring.cloud.stream.default.consumer.auto-offset-reset=earliest

# --- Địa chỉ các service mà saga gọi ĐỒNG BỘ để điều phối --------------------
# Orchestrator gọi Inventory (giữ chỗ) rồi Payment (thu tiền); lỗi thì chạy bù trừ
# (compensating transaction). Local trỏ localhost; trên K8s thay bằng DNS nội bộ http://<svc>:<port>.
services.inventory.url=http://localhost:8083
services.payment.url=http://localhost:8086

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
