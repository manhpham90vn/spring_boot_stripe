worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Không lộ phiên bản nginx ở header Server / trang lỗi (giảm thông tin cho kẻ dò).
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate-limit cho webhook (đi THẲNG payment, KHÔNG qua gateway nên không được
    # gateway bảo vệ). Key theo IP nguồn; mỗi IP ~50 req/s, cho dồn tới 100 (Stripe
    # có thể bắn cụm event hợp lệ). Vượt ngưỡng trả 429 thay vì 503 mặc định.
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Bảng tra cứu service -> địa chỉ nội bộ (chỉ dùng cho các route hạ tầng:
    # /health/<svc> và /api-docs/<svc>). Traffic nghiệp vụ KHÔNG đi qua đây mà
    # luôn đi qua apigateway (xem location /api/). Tên service = DNS nội bộ trong
    # docker network; cổng khớp server.port của từng service.
    map $svc $svc_upstream {
        default      "";
        apigateway   apigateway:8080;
        auth         auth:8081;
        catalog      catalog:8082;
        inventory    inventory:8083;
        order        order:8084;
        payment      payment:8086;
        ticket       ticket:8087;
        notification notification:8088;
        waitingroom  waitingroom:8089;
    }

    map $http_origin $cors_origin {
        default                                "";
        "~^http://localhost(:[0-9]+)?$"        $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$"     $http_origin;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        # ---------------------------------------------------------------------
        # Bản đồ đường vào (chỉ những path liệt kê dưới đây mới có cửa ra ngoài;
        # mọi path khác -> 404 từ chính nginx):
        #   /api/...           -> apigateway:8080  (TẤT CẢ traffic nghiệp vụ)
        #   /webhooks/...      -> payment:8086     (Stripe webhook, bỏ qua gateway)
        #   /healthz           -> nginx tự trả 200
        #   /health/<svc>      -> <svc>/actuator/health
        #   /api-docs/<svc>    -> <svc>/v3/api-docs (cho swagger-ui gom spec)
        #   /swagger/...       -> swagger-ui
        #
        # CHỦ ĐÍCH KHÔNG expose ra biên:
        #   /internal/...  -> API nội bộ service↔service (quy ước, xem
        #     docs/API-CONVENTIONS.md). Vd /internal/jwks của Auth (auth:8081): CHỈ
        #     apigateway/service gọi (server-to-server qua JWK_SET_URI) để lấy public
        #     key verify JWT. Client/trình duyệt không bao giờ cần, nên KHÔNG có
        #     location nào cho /internal -> gọi từ ngoài 404. Đừng "sửa" bằng cách
        #     thêm route: phơi endpoint nội bộ ra Internet chỉ tăng bề mặt tấn công.
        #     Muốn debug thì gọi thẳng auth:8081/internal/jwks trong network.
        # ---------------------------------------------------------------------

        # Cửa vào DUY NHẤT cho traffic nghiệp vụ. apigateway lo verify JWT (filter,
        # không phải endpoint), rate limit, circuit breaker rồi route tới service.
        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age           86400 always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;

            set $apigateway apigateway;
            proxy_pass http://$apigateway:8080;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # GHI ĐÈ (không nối) bằng IP thật: nginx là hop tin cậy DUY NHẤT, nên XFF chỉ
            # nên chứa đúng IP client. Nếu dùng $proxy_add_x_forwarded_for thì giá trị
            # client tự gửi sẽ nằm ĐẦU chuỗi, mà gateway lấy phần tử đầu làm key rate-limit
            # -> client giả mạo XFF để vượt giới hạn theo-IP (brute-force /api/auth/login).
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook Stripe đi THẲNG payment, bỏ qua apigateway (đây là "reverse
        # proxy DMZ"). Payment verify chữ ký Stripe chứ không phải JWT.
        location /webhooks/ {
            # Chặn flood: payment phải verify chữ ký HMAC mỗi request. Body webhook nhỏ
            # nên siết riêng 1m (đè mức 20m chung), tránh nuốt payload lớn vô ích.
            limit_req zone=webhooks burst=100 nodelay;
            client_max_body_size 1m;

            set $payment payment;
            proxy_pass http://$payment:8086;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Ghi đè bằng IP thật (xem giải thích ở location /api/).
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Health của từng service, vd /health/auth -> auth:8081/actuator/health.
        # <svc> không có trong bảng map ($svc_upstream rỗng) -> 404.
        location ~ ^/health/(?<svc>[a-z]+)/?$ {
            if ($svc_upstream = "") { return 404; }
            proxy_pass http://$svc_upstream/actuator/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OpenAPI spec của từng service cho swagger-ui gom lại, vd
        # /api-docs/auth -> auth:8081/v3/api-docs. LƯU Ý: apigateway KHÔNG có
        # springdoc và không có API surface riêng (chỉ route + /__fallback) nên
        # cố tình không nằm trong danh sách swagger-ui; gọi /api-docs/apigateway
        # sẽ chạm gateway nhưng 404 vì gateway không có /v3/api-docs.
        location ~ ^/api-docs/(?<svc>[a-z]+)$ {
            if ($svc_upstream = "") { return 404; }
            proxy_pass http://$svc_upstream/v3/api-docs;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /swagger/ {
            set $swaggerui swagger-ui;
            proxy_pass http://$swaggerui:8080;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
