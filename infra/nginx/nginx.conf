worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $svc $svc_upstream {
        default      "";
        apigateway   apigateway:8080;
        auth         auth:8081;
        catalog      catalog:8082;
        inventory    inventory:8083;
        order        order:8084;
        payment      payment:8086;
        ticket       ticket:8087;
        notification notification:8088;
        waitingroom  waitingroom:8089;
    }

    map $http_origin $cors_origin {
        default                                "";
        "~^http://localhost(:[0-9]+)?$"        $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$"     $http_origin;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age           86400 always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;

            set $apigateway apigateway;
            proxy_pass http://$apigateway:8080;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            set $payment payment;
            proxy_pass http://$payment:8086;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location ~ ^/health/(?<svc>[a-z]+)/?$ {
            if ($svc_upstream = "") { return 404; }
            proxy_pass http://$svc_upstream/actuator/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api-docs/(?<svc>[a-z]+)$ {
            if ($svc_upstream = "") { return 404; }
            proxy_pass http://$svc_upstream/v3/api-docs;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /swagger/ {
            set $swaggerui swagger-ui;
            proxy_pass http://$swaggerui:8080;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /admin/ {
            set $admin admin;
            proxy_pass http://$admin:5174;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }

        location / {
            set $web web;
            proxy_pass http://$web:5173;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }
    }
}
