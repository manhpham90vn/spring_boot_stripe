spring.application.name=ticket
server.port=8087

# === PostgreSQL riêng của Ticket (vé đã phát + trạng thái sử dụng) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# === Spring Cloud Stream (Kafka binder): consume event "đơn hoàn tất" để sinh vé ===
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.default.group=ticket
spring.cloud.stream.default.consumer.auto-offset-reset=earliest
# Khai báo hàm xử lý + binding khi viết code, ví dụ:
# spring.cloud.function.definition=onOrderCompleted
# spring.cloud.stream.bindings.onOrderCompleted-in-0.destination=order.completed

# === Actuator / metrics ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
