# Ticket — quản lý "vé đã phát" (khác ticket type ở Catalog). Consume order.events → phát vé QR ký số.
spring.application.name=ticket
server.port=8087

# --- DB riêng: vé đã phát + trạng thái sử dụng (đã quét/chưa quét) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Gọi Catalog resolve nhãn ghế (SEATED) lúc phát vé ----------------------
services.catalog.url=${SERVICES_CATALOG_URL:http://localhost:8082}

# --- Kafka: consume event "đơn hoàn tất" từ Order để SINH vé (QR ký số) -----
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.stream.default.group=ticket
spring.cloud.stream.default.consumer.auto-offset-reset=earliest
# Consumer functional: bean orderCompletedSink ← topic order.events.
spring.cloud.function.definition=orderCompletedSink
spring.cloud.stream.bindings.orderCompletedSink-in-0.destination=order.events

# --- Resource server (common-security): /api/ticket/** cần JWT --------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/internal/jwks}
app.security.issuer=${JWT_ISSUER:auth}

# --- QR: secret ký HMAC token vé (prod nạp từ K8s Secret) -------------------
ticket.qr.secret=${TICKET_QR_SECRET:dev-qr-secret-change-me}

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
