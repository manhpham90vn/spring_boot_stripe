spring.application.name=apigateway
server.port=8080

# JWKS của Auth: nơi gateway tải public key để verify chữ ký JWT (cache lại, không gọi mỗi request).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/internal/jwks}
# Issuer bắt buộc của token; phải khớp auth.jwt.issuer của Auth. Dùng CHUNG tên property
# app.security.issuer với các service hạ nguồn (common-security) để tránh nhầm lẫn.
app.security.issuer=${JWT_ISSUER:auth}

# --- Edge-policy: ai được vào route nào (xem GatewayAccessProperties) --------
# NƠI DUY NHẤT khai luật truy cập ở BIÊN. Chỉ phân biệt PUBLIC vs cần-token; luật theo
# role (vd ADMIN) để service tự lo (common-security) — gateway không đụng nghiệp vụ.
# Nhờ quy ước path (docs/API-CONVENTIONS.md), CHỈ CẦN MỘT luật: mọi nhánh công khai đều
# nằm dưới /api/<service>/public/** → mở ở biên. (* khớp đúng 1 segment tên service.)
# Bao trùm auth (register/login), catalog (duyệt danh mục) và mọi service mới — tự động.
app.gateway.access.rules[0].pattern=/api/*/public/**
app.gateway.access.rules[0].access=PERMIT_ALL
# MỌI path khác → anyExchange = cần JWT, gồm:
#   /api/auth/me, /api/catalog/admin/**, /api/order/**, /api/payment/**, /api/inventory/**...
# Admin chỉ cần "có token" ở biên; role ADMIN do service kiểm (common-security).

# Redis dùng làm "kho đếm" cho rate limiter (token bucket dùng chung mọi replica gateway).
# Đây là I/O reactive của Spring Data Redis, KHÔNG phải JDBC/JPA blocking — hợp lệ với gateway.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Bảng định tuyến ---
# QUY ƯỚC PATH (xem docs/API-CONVENTIONS.md): mỗi service một tiền tố /api/<service>/**
# với <service> = ĐÚNG tên service (= route id = DNS = spring.application.name). KHÔNG số
# nhiều, không gạch nối tuỳ tiện. Route nội bộ /internal/** CỐ Ý không có ở đây (service
# gọi nhau thẳng qua DNS, rào bằng NetworkPolicy). Webhook Stripe vào thẳng Payment qua nginx.
# Mỗi route ánh xạ 1 nhóm path → 1 service hạ nguồn (qua K8s DNS / biến ROUTE_*_URI), kèm:
#   - predicates[0] Path=...    : path nào thì khớp route này.
#   - filters[0] RequestRateLimiter: giới hạn nhịp; replenishRate = số token nạp lại mỗi giây
#       (~req/giây bền vững), burstCapacity = trần cho phép dồn tức thời. key-resolver=clientKeyResolver
#       (tính quota theo user, xem GatewayConfig). Service tranh chấp/nhạy cảm để rate thấp.
#   - filters[1] CircuitBreaker : ngắt mạch khi hạ nguồn lỗi, fallback về /__fallback (xem GatewayConfig).
# Lưu ý: webhook Stripe KHÔNG đi qua đây — vào thẳng Payment qua Ingress riêng (reverse proxy DMZ).
spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=${ROUTE_AUTH_URI:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.name=authCb
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.fallbackUri=forward:/__fallback

