# --- Observability ---
# Mở các actuator endpoint cho hạ tầng: health (K8s probe), prometheus (scrape), gateway (xem routes).
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
# Sampling 0.0 = mặc định KHÔNG xuất trace (tránh quá tải lúc flash sale); chỉnh tăng khi cần debug.
management.tracing.sampling.probability=0.0
# Đầu thu OTLP (OpenTelemetry collector) để gửi trace đi.
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
