spring.application.name=apigateway
server.port=8080

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=${ROUTE_AUTH_URI:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog
spring.cloud.gateway.server.webflux.routes[1].uri=${ROUTE_CATALOG_URI:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog/**

spring.cloud.gateway.server.webflux.routes[2].id=inventory
spring.cloud.gateway.server.webflux.routes[2].uri=${ROUTE_INVENTORY_URI:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webflux.routes[3].id=order
spring.cloud.gateway.server.webflux.routes[3].uri=${ROUTE_ORDER_URI:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[4].id=payment
spring.cloud.gateway.server.webflux.routes[4].uri=${ROUTE_PAYMENT_URI:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webflux.routes[5].id=waitingroom
spring.cloud.gateway.server.webflux.routes[5].uri=${ROUTE_WAITINGROOM_URI:http://localhost:8089}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/waiting-room/**

management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
