# Waiting Room — van chặn spike trước flash sale (làm CUỐI CÙNG). (Code chưa viết, config khung.)
spring.application.name=waitingroom
server.port=8089

# --- Redis là store CHÍNH (KHÔNG có PostgreSQL) -----------------------------
# Hàng đợi dùng Redis sorted set; thả người vào hạ nguồn theo nhịp mà Inventory/Stripe chịu
# được. Service này hầu như chỉ thao tác Redis nên không cần DB quan hệ riêng.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
