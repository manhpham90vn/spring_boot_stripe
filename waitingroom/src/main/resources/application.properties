# Waiting Room — van chặn spike trước flash sale. Store CHÍNH: Redis (KHÔNG có PostgreSQL).
spring.application.name=waitingroom
server.port=8089

# --- Redis là store CHÍNH ----------------------------------------------------
# Hàng đợi = Redis sorted set; thả người vào hạ nguồn theo nhịp Inventory/Stripe chịu được.
# Reactive Redis (WebFlux thuần) — không JDBC/JPA blocking.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Admission (nhịp thả) ----------------------------------------------------
# QUAN TRỌNG: rate/token-ttl/admit-ttl ở đây CHỈ là giá trị SEED LẦN ĐẦU. Lúc khởi động chúng
# được ghi vào Redis hash `wr:config` (HSETNX, không đè giá trị admin). Nguồn cấu hình SỐNG lúc
# chạy là Redis — chỉnh từ trang admin (PUT /api/waitingroom/admin/config), áp dụng ngay không
# cần redeploy. Sửa file này CHỈ có tác dụng cho cụm Redis CHƯA có wr:config (lần seed đầu).
#   rate = số người thả MỖI GIÂY. Override per-event qua /internal/events/{id}/rate (wr:rate:{id}).
#         Đặt theo throughput thật Order/Inventory/Stripe (~100-200 req/s Stripe là trần cứng).
#   token-ttl = hạn 1 chỗ trong hàng (wr:token:*) — chống rác khi client biến mất.
#   admit-ttl = hạn PASS sau khi được thả (wr:admit:*) — vào trễ quá hạn phải xếp lại.
# tick = chu kỳ chạy bộ thả AdmissionJob (KHÔNG lưu Redis — nhịp scheduler cố định, 1s → rate ~ người/giây).
waitingroom.admission.rate=${WR_ADMISSION_RATE:20}
waitingroom.admission.token-ttl=PT30M
waitingroom.admission.admit-ttl=PT2M
waitingroom.admission.tick=PT1S

# --- Phụ thuộc: đọc tồn kho để biết khi nào NGỪNG thả ------------------------
# Gọi thẳng DNS nội bộ Inventory (/internal/**, bỏ qua gateway). Ánh xạ event→ticketType (tuỳ chọn):
#   waitingroom.event-ticket-types.<eventId>=<ttId1>,<ttId2>
# Không map → dựa vào cờ sold-out (Inventory/Order bắn qua /internal/events/{id}/soldout) + rate.
waitingroom.inventory.base-url=${ROUTE_INVENTORY_URI:http://localhost:8083}

# --- Bảo mật: verify JWT để gác /api/waitingroom/admin/** (role ADMIN) ------
# Public/internal mở; chỉ admin cần token. Tải JWKS của Auth (cache) để verify cục bộ.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/internal/jwks}
app.security.issuer=${JWT_ISSUER:auth}

# --- Observability (giống mọi service) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=0.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
