name: ticketing-infra

x-app: &app
  restart: unless-stopped
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  image: ticketing-dev:latest

x-spring-env: &spring-env
  SPRING_DATASOURCE_USERNAME: app
  SPRING_DATASOURCE_PASSWORD: app
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticketing-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ticketing-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticketing-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data

  minio:
    image: minio/minio:latest
    container_name: ticketing-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: ticketing-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'cho MinIO...'; sleep 2; done &&
      mc mb -p local/event-images &&
      mc mb -p local/ticket-qr &&
      mc anonymous set download local/event-images &&
      echo 'buckets san sang';
      "

  apigateway:
    <<: *app
    container_name: ticketing-apigateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:8081/oauth2/jwks
      ROUTE_AUTH_URI: http://auth:8081
      ROUTE_CATALOG_URI: http://catalog:8082
      ROUTE_INVENTORY_URI: http://inventory:8083
      ROUTE_ORDER_URI: http://order:8084
      ROUTE_PAYMENT_URI: http://payment:8086
      ROUTE_WAITINGROOM_URI: http://waitingroom:8089
    volumes:
      - ./apigateway:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8080:8080"

  auth:
    <<: *app
    container_name: ticketing-auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
    volumes:
      - ./auth:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8081:8081"

  catalog:
    <<: *app
    container_name: ticketing-catalog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
    volumes:
      - ./catalog:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8082:8082"

  inventory:
    <<: *app
    container_name: ticketing-inventory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
    volumes:
      - ./inventory:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8083:8083"

  order:
    <<: *app
    container_name: ticketing-order
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order
      SERVICES_INVENTORY_URL: http://inventory:8083
      SERVICES_PAYMENT_URL: http://payment:8086
    volumes:
      - ./order:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8084:8084"

  payment:
    <<: *app
    container_name: ticketing-payment
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
    volumes:
      - ./payment:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8086:8086"

  ticket:
    <<: *app
    container_name: ticketing-ticket
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket
    volumes:
      - ./ticket:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8087:8087"

  notification:
    <<: *app
    container_name: ticketing-notification
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    volumes:
      - ./notification:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8088:8088"

  waitingroom:
    <<: *app
    container_name: ticketing-waitingroom
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *spring-env
    volumes:
      - ./waitingroom:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8089:8089"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    image: ticketing-node-dev:latest
    container_name: ticketing-web
    restart: unless-stopped
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    image: ticketing-node-dev:latest
    container_name: ticketing-admin
    restart: unless-stopped
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 5174"
    volumes:
      - ./admin:/app
      - admin-node-modules:/app/node_modules
    ports:
      - "5174:5174"

  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing-nginx
    restart: unless-stopped
    depends_on:
      - apigateway
      - payment
      - web
      - admin
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  maven-cache:
  web-node-modules:
  admin-node-modules:
  postgres-data:
  redis-data:
  kafka-data:
  redisinsight-data:
  pgadmin-data:
  mailpit-data:
  minio-data:
