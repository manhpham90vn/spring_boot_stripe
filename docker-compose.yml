name: ticketing-infra

# ---------------------------------------------------------------------------
# Compose được chia theo PROFILE để bật/tắt từng nhóm độc lập:
#   db        -> hạ tầng lưu trữ: postgres, redis, kafka, minio, mailpit
#   services  -> init containers + Debezium connect + toàn bộ Spring service + nginx
#   frontend  -> web (React) + admin (Vue), chạy vite dev
#   tunnel    -> cloudflared (expose public, optional)
#
# Compose v2.20+ tự kéo dependency ở profile khác lên qua depends_on, nên chỉ
# cần bật profile của thứ mình muốn:
#   docker compose --profile db up -d                  # chỉ hạ tầng
#   docker compose --profile services up -d            # service (tự bật db)
#   docker compose --profile services --profile frontend up -d
#   docker compose --profile services --profile frontend --profile tunnel up -d
#
# Tools quản lý hạ tầng (swagger-ui, adminer, kafka-ui, redis-commander) nằm ở
# file riêng cho gọn:
#   docker compose -f docker-compose.tools.yml --profile tools up -d
# ---------------------------------------------------------------------------

x-app: &app
  restart: unless-stopped
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  image: ticketing-dev:latest

x-fe: &fe
  restart: unless-stopped
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.node
  image: ticketing-node:latest
  working_dir: /app
  environment:
    # Vite dev proxy /api -> apigateway (cửa vào nghiệp vụ duy nhất), qua DNS nội bộ.
    API_TARGET: http://apigateway:8080

x-spring-env: &spring-env
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-app}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-app}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092

x-app-healthcheck: &app-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 120s

services:
  # ========================================================================
  # Profile: db — hạ tầng lưu trữ / message broker
  # ========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    profiles: ["db", "services"]
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_slot_wal_keep_size=8GB"
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    profiles: ["db", "services"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka
    profiles: ["db", "services"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing-mailpit
    profiles: ["db", "services"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data

  minio:
    image: minio/minio:latest
    container_name: ticketing-minio
    profiles: ["db", "services"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: ticketing-minio-init
    profiles: ["db", "services"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for MinIO...'; sleep 2; done &&
      mc mb -p local/event-images &&
      mc mb -p local/ticket-qr &&
      mc anonymous set download local/event-images &&
      echo 'buckets ready';
      "

  # ========================================================================
  # Profile: services — init containers, CDC, Spring services, edge nginx
  # ========================================================================
  connect:
    image: quay.io/debezium/connect:2.7
    container_name: ticketing-connect
    profiles: ["services"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  connect-init:
    image: curlimages/curl:latest
    container_name: ticketing-connect-init
    profiles: ["services"]
    restart: "no"
    depends_on:
      connect:
        condition: service_healthy
      auth:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy
    volumes:
      - ./infra/debezium:/config:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        until curl -sf http://connect:8083/ >/dev/null; do echo 'waiting for connect...'; sleep 3; done
        rc=0
        for f in /config/*.json; do
          name=$$(basename "$$f" .json)
          code=$$(curl -s -o /tmp/resp -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data @"$$f" http://connect:8083/connectors)
          echo "register $$name -> HTTP $$code"; cat /tmp/resp; echo
          case "$$code" in
            201|409) ;;
            *) echo "  !! $$name registration failed"; rc=1 ;;
          esac
        done
        exit $$rc

  common-security-init:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: ticketing-dev:latest
    container_name: ticketing-common-security-init
    profiles: ["services"]
    restart: "no"
    volumes:
      - ./libs/common-security:/workspace
      - maven-cache:/home/app/.m2
    entrypoint: ["sh", "-c", "./mvnw -B -ntp install -DskipTests"]

  common-core-init:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: ticketing-dev:latest
    container_name: ticketing-common-core-init
    profiles: ["services"]
    restart: "no"
    volumes:
      - ./libs/common-core:/workspace
      - maven-cache:/home/app/.m2
    entrypoint: ["sh", "-c", "./mvnw -B -ntp install -DskipTests"]

  jwt-keys-init:
    image: alpine:3.20
    container_name: ticketing-jwt-keys-init
    profiles: ["services"]
    restart: "no"
    volumes:
      - ./infra/keys:/keys
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        if [ -f /keys/jwt-private.pem ] && [ -f /keys/jwt-public.pem ]; then
          echo 'JWT keys already present, skipping.'
        else
          echo 'Generating RSA JWT key pair...'
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/jwt-private.pem
          openssl pkey -in /keys/jwt-private.pem -pubout -out /keys/jwt-public.pem
          chmod 644 /keys/jwt-private.pem /keys/jwt-public.pem
          echo 'JWT keys generated.'
        fi

  apigateway:
    <<: *app
    container_name: ticketing-apigateway
    profiles: ["services"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:8081/internal/jwks
      ROUTE_AUTH_URI: http://auth:8081
      ROUTE_CATALOG_URI: http://catalog:8082
      ROUTE_INVENTORY_URI: http://inventory:8083
      ROUTE_ORDER_URI: http://order:8084
      ROUTE_PAYMENT_URI: http://payment:8086
      ROUTE_TICKET_URI: http://ticket:8087
      ROUTE_WAITINGROOM_URI: http://waitingroom:8089
    volumes:
      - ./apigateway:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8080:8080"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]

  auth:
    <<: *app
    container_name: ticketing-auth
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      jwt-keys-init:
        condition: service_completed_successfully
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      AUTH_JWT_PRIVATE_KEY_LOCATION: file:/keys/jwt-private.pem
      AUTH_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
    volumes:
      - ./auth:/workspace
      - ./infra/keys:/keys:ro
      - maven-cache:/home/app/.m2
    ports:
      - "8081:8081"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]

  catalog:
    <<: *app
    container_name: ticketing-catalog
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      common-security-init:
        condition: service_completed_successfully
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      JWK_SET_URI: http://auth:8081/internal/jwks
      JWT_ISSUER: auth
      SERVICES_INVENTORY_URL: http://inventory:8083
    volumes:
      - ./catalog:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8082:8082"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]

  inventory:
    <<: *app
    container_name: ticketing-inventory
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
    volumes:
      - ./inventory:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8083:8083"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]

  order:
    <<: *app
    container_name: ticketing-order
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      common-security-init:
        condition: service_completed_successfully
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order
      JWK_SET_URI: http://auth:8081/internal/jwks
      JWT_ISSUER: auth
      SERVICES_CATALOG_URL: http://catalog:8082
      SERVICES_INVENTORY_URL: http://inventory:8083
      SERVICES_PAYMENT_URL: http://payment:8086
    volumes:
      - ./order:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8084:8084"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]

  payment:
    <<: *app
    container_name: ticketing-payment
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
    volumes:
      - ./payment:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8086:8086"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]

  ticket:
    <<: *app
    container_name: ticketing-ticket
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      common-security-init:
        condition: service_completed_successfully
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket
      SERVICES_CATALOG_URL: http://catalog:8082
      JWK_SET_URI: http://auth:8081/internal/jwks
      JWT_ISSUER: auth
    volumes:
      - ./ticket:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8087:8087"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health || exit 1"]

  notification:
    <<: *app
    container_name: ticketing-notification
    profiles: ["services"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    volumes:
      - ./notification:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8088:8088"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]

  waitingroom:
    <<: *app
    container_name: ticketing-waitingroom
    profiles: ["services"]
    depends_on:
      redis:
        condition: service_healthy
      common-core-init:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      # Verify JWT để gác /api/waitingroom/admin/** (chỉnh cấu hình admission từ admin).
      JWK_SET_URI: http://auth:8081/internal/jwks
      # Đọc tồn kho để biết khi nào ngừng thả (admission rate phải biết tồn kho còn lại).
      ROUTE_INVENTORY_URI: http://inventory:8083
    volumes:
      - ./waitingroom:/workspace
      - maven-cache:/home/app/.m2
    ports:
      - "8089:8089"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8089/actuator/health || exit 1"]

  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing-nginx
    profiles: ["services"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ========================================================================
  # Profile: frontend — web (React) + admin (Vue), vite dev server
  # ========================================================================
  web:
    <<: *fe
    container_name: ticketing-web
    profiles: ["frontend"]
    # pnpm install rồi chạy vite, bind 0.0.0.0 để truy cập từ host.
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"

  admin:
    <<: *fe
    container_name: ticketing-admin
    profiles: ["frontend"]
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 5174"
    volumes:
      - ./admin:/app
      - admin-node-modules:/app/node_modules
    ports:
      - "5174:5174"

  # ========================================================================
  # Profile: tunnel — cloudflared (expose public, optional)
  # ========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ticketing-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate --url http://nginx:80

# Network có tên cố định để docker-compose.tools.yml join vào (external).
networks:
  default:
    name: ticketing-net

volumes:
  maven-cache:
  web-node-modules:
  admin-node-modules:
  postgres-data:
  redis-data:
  kafka-data:
  mailpit-data:
  minio-data:
